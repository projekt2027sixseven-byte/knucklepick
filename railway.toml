# Railway — https://railway.app
# Create a Web Service from this repo, attach Postgres (and optional Redis), then set env vars from `.env.example`.
# Or deploy from the included Dockerfile (set `DATABASE_URL`, `DIRECT_URL`, `JWT_SECRET`, `FRONTEND_URL`, etc.).

[deploy]
startCommand = "npm run start -w @match-oracle/backend"
healthcheckPath = "/api/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
