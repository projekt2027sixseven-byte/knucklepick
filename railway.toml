# Railway — https://railway.app
# Service root: repository root (not app/backend). Uses Nixpacks build below; or deploy the root Dockerfile.
# Env: see `.env.example` and README (DATABASE_URL, DIRECT_URL, JWT_SECRET, FRONTEND_URL, etc.).

[build]
builder = "NIXPACKS"
buildCommand = "npm ci && npx prisma generate --schema app/db/prisma/schema.prisma && npm run build -w @match-oracle/backend"

[deploy]
startCommand = "npm run start -w @match-oracle/backend"
healthcheckPath = "/api/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
